# Stack for test_integration.py: a catalog (seeded, or a production dump) in
# postgres is migrated, then read back through dls-tiled with real Keycloak
# tokens and the central authorisation OPA. Its ports (postgres 5433,
# keycloak 8082, opa 8182, tiled 8408) leave blueapi's system test stack
# (8081, 8181, 8407) free to run alongside.

services:
  postgres:
    image: docker.io/postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 30
    security_opt:
      - label=disable

  keycloak:
    image: keycloak/keycloak:26.8
    environment:
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_HOSTNAME=http://localhost:8082
    command: ["start-dev"]
    ports:
      - "8082:8080"
    healthcheck:
      test: /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password admin
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - label=disable

  # Central authorisation OPA (gitlab.diamond.ac.uk/auth-auth/authorisation),
  # built from a local checkout, with the test data in opa_bundle
  opa:
    build:
      context: ${AUTHORISATION_REPO:-../../../authorisation}
    network_mode: host # Port 8182
    volumes:
      - ./opa_bundle:/test_bundle:ro
    environment:
      - ISSUER=http://localhost:8082/realms/master
    # The image's entrypoint serves on 8181
    entrypoint:
      - opa
      - run
      - --server
      - --addr=:8182
      - --authorization=basic
      - --authentication=token
      - /policies
      - /test_bundle
    security_opt:
      - label=disable

  # dls-tiled's own image, so its access policy is what gets tested
  tiled:
    build:
      context: ../..
      target: runtime
    network_mode: host # Port 8408
    volumes:
      - ./tiled_config:/deploy/config:ro
    command: ["dls-tiled", "serve", "config", "/deploy/config", "--host", "0.0.0.0", "--port", "8408"]
    security_opt:
      - label=disable
