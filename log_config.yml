# tiled's default logging (tiled.server.logging_config.LOGGING_CONFIG) plus the
# dls_tiled plugin loggers, which otherwise have no handler and drop INFO.
# Use with: dls-tiled serve config ... --log-config /deploy/log_config.yml
version: 1
disable_existing_loggers: false
filters:
  principal:
    "()": tiled.server.principal_log_filter.PrincipalFilter
  correlation_id:
    "()": asgi_correlation_id.CorrelationIdFilter
    default_value: "-"
    uuid_length: 16
formatters:
  access:
    "()": tiled.server.logging_config.AccessFormatter
    datefmt: "%Y-%m-%dT%H:%M:%S"
    format: '[%(correlation_id)s] %(client_addr)s (%(principal)s) - "%(request_line)s" %(status_code)s'
    use_colors: true
  default:
    "()": uvicorn.logging.DefaultFormatter
    datefmt: "%Y-%m-%dT%H:%M:%S"
    format: "[%(correlation_id)s] %(levelprefix)s %(name)s: %(message)s"
    use_colors: true
handlers:
  access:
    class: logging.StreamHandler
    filters: [principal, correlation_id]
    formatter: access
    stream: ext://sys.stdout
  default:
    class: logging.StreamHandler
    filters: [correlation_id]
    formatter: default
    stream: ext://sys.stderr
loggers:
  tiled:
    handlers: [default]
    level: INFO
    propagate: false
  dls_tiled:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [default]
    level: INFO
    propagate: false
