# Default values for tiled.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# One tiled Deployment and Service per beamline. Each pod gets TILED_BEAMLINE=<name>,
# and may add its own securityContext (supplementalGroups for POSIX access to the
# beamline data), livenessProbe, readinessProbe, extraEnvVars, volumes and
# volumeMounts, which are merged with or appended to the global values below, e.g.
#   - name: p51
#     securityContext:
#       supplementalGroups: [12345]
#     volumes:
#       - name: data
#         hostPath: {path: /dls/p51/data}
#     volumeMounts:
#       - name: data
#         mountPath: /dls/p51/data
beamlines:
  - name: default

# The tiled server config, rendered into a ConfigMap mounted at /deploy/config.
config:
  # Opt in to the dls-tiled plugins by listing their routers, e.g. the ViSR binning
  # endpoint:
  # routers:
  #   - dls_tiled.visr:visr_router
  authentication:
    allow_anonymous_access: false
  # Envoy sends /.../<beamline>/... to that beamline's pod, so each pod serves its
  # tree at /<beamline>. Use a per-beamline catalog in production, e.g.
  # uri: postgresql://.../$TILED_BEAMLINE
  # To let tokens issued by one pod verify on the others (all /api/v1/auth/* traffic
  # goes to envoy.defaultBeamline), share the signing keys, e.g.
  #   secret_keys: ["$TILED_SECRET_KEY"]
  # with TILED_SECRET_KEY added to extraEnvVars from a Secret.
  trees:
    - path: /$TILED_BEAMLINE
      tree: catalog
      args:
        uri: "sqlite:////storage/catalog.db"
        writable_storage: "/storage/data"
        init_if_not_exists: true

# Restart the tiled and envoy pods when their ConfigMap changes, by putting a
# checksum of it in a pod annotation. See
# https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
rollOnConfigChange: true

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/diamondlightsource/dls-tiled
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Override the container command. If not set, the image's CMD is used.
command: []

# Override the container args. If not set, the image's ENTRYPOINT args are used.
args: []

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # The Service port; tiled itself always listens on 8000 (the image CMD)
  port: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  # A single "/" path (plain "Prefix" pathType) is forwarded to the envoy
  # proxy Service (see .Values.envoy below), which performs the actual
  # per-beamline regex routing. Cluster policy (Kyverno) disallows
  # "ImplementationSpecific"/regex paths directly on Ingress resources,
  # so that routing logic lives in envoy instead of here.
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Envoy proxy that performs regex-based routing to the per-beamline
# Services, matching requests where the beamline name is the first segment of
# the tiled path (e.g. /api/v1/search/p51/cm44254/cm44254-1/data) and
# forwarding the complete, unmodified request to that beamline's own
# Service. This exists because the Ingress resource itself can't do regex
# path matching under the cluster's Kyverno policy (see ingress.annotations
# comment above). Any request that doesn't match a beamline's name-in-path
# regex (e.g. the UI at "/") falls through to the defaultBeamline's Service.
envoy:
  enabled: true
  # Envoy is in front of every beamline, so run more than one; a
  # PodDisruptionBudget is added when this is above 1
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: v1.39.4
    pullPolicy: IfNotPresent
  listenerPort: 10000
  # Bound to 127.0.0.1, use with kubectl exec
  adminPort: 9901
  # The tiled endpoints, before the tiled path, that envoy routes on. Add any
  # plugin routers enabled in config.routers (mounted at /custom and /api/v1).
  pathPrefixes:
    - api/v1/(search|distinct|metadata|register|data_source|revisions)
    - api/v1/(array|ragged)/(block|full)
    - api/v1/(table/partition|table/full|container/full|node/full)
    - api/v1/(awkward/buffers|awkward/full|asset/bytes|asset/manifest)
    - api/v1/stream/(single|close)
    - (api/v1|custom)/binned
    - zarr/v[23]
  # Name of the entry in .Values.beamlines that catch-all (unmatched) requests
  # are routed to.
  defaultBeamline: default
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  # Run as a fixed non-root user. The Deployment starts envoy directly with
  # `command: [envoy]`, skipping the image's docker-entrypoint.sh, which only
  # matters when starting as root.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# Each beamline in .Values.beamlines may set its own livenessProbe/readinessProbe
# to override these defaults (same merge pattern as beamlines[].securityContext).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

#This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []


# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: config
    mountPath: "/deploy/config"
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}


# Additional envVars to mount to the pod. The API key secret is optional so the
# chart installs without it; create a secret named tiled-secrets to set the key.
extraEnvVars:
- name: TILED_SINGLE_USER_API_KEY
  valueFrom:
    secretKeyRef:
      name: tiled-secrets
      key: TILED_SINGLE_USER_API_KEY
      optional: true
