{{- if .Values.envoy.enabled }}
{{- /* A bad config stops envoy starting and takes the whole ingress down, so fail the render instead */}}
{{- $names := list }}
{{- range .Values.beamlines }}{{ $names = append $names .name }}{{ end }}
{{- if not (has .Values.envoy.defaultBeamline $names) }}
{{- fail (printf "envoy.defaultBeamline %q must be one of beamlines %v" .Values.envoy.defaultBeamline $names) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tiled.fullname" . }}-envoy-config
  labels:
    {{- include "tiled.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-proxy
data:
  envoy.yaml: |
    # Only reachable from inside the pod (kubectl exec), so other pods can't
    # e.g. POST /quitquitquit
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: {{ .Values.envoy.adminPort }} }
    # The beamline regexes list every tiled endpoint, which is over RE2's default limit
    layered_runtime:
      layers:
        - name: static
          static_layer:
            re2.max_program_size.error_level: 1000
    static_resources:
      listeners:
        - name: listener_http
          address:
            socket_address: { address: 0.0.0.0, port_value: {{ .Values.envoy.listenerPort }} }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    normalize_path: true
                    merge_slashes: true
                    # For the websockets of /api/v1/stream/single/...
                    upgrade_configs:
                      - upgrade_type: websocket
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: tiled_backend
                          domains: ["*"]
                          routes:
                            - match:
                                path: /envoy-ready
                              direct_response:
                                status: 200
                            {{- range .Values.beamlines }}
                            {{- if ne .name $.Values.envoy.defaultBeamline }}
                            # The beamline is the first segment of the tiled path,
                            # e.g. /api/v1/search/{{ .name }}/... or /zarr/v2/{{ .name }}/...
                            - match:
                                safe_regex:
                                  regex: {{ printf "^/(%s)/%s(/.*)?$" (join "|" $.Values.envoy.pathPrefixes) (regexQuoteMeta .name) | quote }}
                              route:
                                cluster: {{ .name }}_cluster
                                # No timeout: large array/asset reads and slow searches
                                # can take longer than envoy's 15s default
                                timeout: 0s
                            {{- end }}
                            {{- end }}
                            - match:
                                prefix: "/"
                              route:
                                cluster: {{ .Values.envoy.defaultBeamline }}_cluster
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        {{- range .Values.beamlines }}
        - name: {{ .name }}_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: {{ .name }}_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "tiled.beamlineFullname" (dict "root" $ "beamline" .) }}.{{ $.Release.Namespace }}.svc.cluster.local
                          port_value: {{ $.Values.service.port }}
        {{- end }}
{{- end }}
