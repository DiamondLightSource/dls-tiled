{{- if .Values.envoy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tiled.fullname" . }}-envoy
  labels:
    {{- include "tiled.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-proxy
spec:
  type: {{ .Values.envoy.service.type }}
  ports:
    - port: {{ .Values.envoy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tiled.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-proxy
{{- end }}
