{{- range .Values.beamlines }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tiled.beamlineFullname" (dict "root" $ "beamline" .) }}
  labels:
    {{- include "tiled.labels" $ | nindent 4 }}
    tiled.io/beamline: {{ .name }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tiled.selectorLabels" $ | nindent 6 }}
      tiled.io/beamline: {{ .name }}
  template:
    metadata:
      annotations:
        {{- if $.Values.rollOnConfigChange }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tiled.labels" $ | nindent 8 }}
        tiled.io/beamline: {{ .name }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tiled.serviceAccountName" $ }}
      {{- $beamlineSC := .securityContext | default dict }}
      securityContext:
        {{- toYaml (merge (pick $beamlineSC "supplementalGroups") $.Values.podSecurityContext) | nindent 8 }}
      {{- if $.Values.postgresql.enabled }}
      # All beamlines share one catalog database, which postgres creates on
      # first start. Make its tables, retrying until postgres is up and if
      # another beamline's pod is doing the same. A no-op once done.
      initContainers:
        - name: init-catalog
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (merge (omit $beamlineSC "supplementalGroups") $.Values.securityContext) | nindent 12 }}
          command:
            - sh
            - -c
            - until tiled catalog init --if-not-exists "postgresql://$PGUSER:$PGPASSWORD@$PGHOST/$PGDATABASE"; do sleep 2; done
          env:
            {{- include "tiled.postgresqlEnv" $ | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml (merge (omit $beamlineSC "supplementalGroups") $.Values.securityContext) | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            {{- toYaml (merge (.livenessProbe | default dict) $.Values.livenessProbe) | nindent 12 }}
          readinessProbe:
            {{- toYaml (merge (.readinessProbe | default dict) $.Values.readinessProbe) | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- with concat $.Values.volumeMounts (.volumeMounts | default list) }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $env := concat $.Values.extraEnvVars (.extraEnvVars | default list) }}
          {{- if or $env $.Values.postgresql.enabled }}
          env:
            {{- if $.Values.postgresql.enabled }}
            {{- include "tiled.postgresqlEnv" $ | nindent 12 }}
            {{- end }}
            {{- with $env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ include "tiled.fullname" $ }}-config
      {{- with concat $.Values.volumes (.volumes | default list) }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
