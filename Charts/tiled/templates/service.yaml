{{- range .Values.beamlines }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tiled.beamlineFullname" (dict "root" $ "beamline" .) }}
  labels:
    {{- include "tiled.labels" $ | nindent 4 }}
    tiled.io/beamline: {{ .name }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tiled.selectorLabels" $ | nindent 4 }}
    tiled.io/beamline: {{ .name }}
{{- end }}
