{{- range .Values.beamlines }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tiled.fullname" $ }}-{{ .name }}
  labels:
    {{- include "tiled.labels" $ | nindent 4 }}
    tiled.io/beamline: {{ .name }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ .port | default $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tiled.selectorLabels" $ | nindent 4 }}
    tiled.io/beamline: {{ .name }}
{{- end }}
