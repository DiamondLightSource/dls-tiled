{{- if .Values.envoy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tiled.fullname" . }}-envoy
  labels:
    {{- include "tiled.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-proxy
spec:
  replicas: {{ .Values.envoy.replicaCount }}
  selector:
    matchLabels:
      {{- include "tiled.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: envoy-proxy
  template:
    metadata:
      labels:
        {{- include "tiled.labels" . | nindent 8 }}
        app.kubernetes.io/component: envoy-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/envoy-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.envoy.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.envoy.securityContext | nindent 12 }}
          command:
            - envoy
          args:
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: {{ .Values.envoy.listenerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /envoy-ready
              port: http
          livenessProbe:
            httpGet:
              path: /envoy-ready
              port: http
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
      volumes:
        - name: envoy-config
          configMap:
            name: {{ include "tiled.fullname" . }}-envoy-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
