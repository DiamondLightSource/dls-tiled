name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:

  lint:
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    strategy:
      matrix:
        runs-on: ["ubuntu-latest"] # can add windows-latest, macos-latest
        # the Python of the ghcr.io/bluesky/tiled image the plugins run in
        python-version: ["3.12"]
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}

  container:
    needs: test
    if: always()
    uses: ./.github/workflows/_container.yml
    with:
      publish: ${{ needs.test.result == 'success' }}
    permissions:
      contents: read
      packages: write

  helm:
    # The chart's default image is the one container pushes for the same tag
    needs: [test, container]
    if: always()
    uses: ./.github/workflows/_helm.yml
    with:
      publish: ${{ needs.test.result == 'success' && needs.container.result == 'success' }}
    permissions:
      contents: read
      packages: write

  dist:
    uses: ./.github/workflows/_dist.yml
  
  release:
    needs: [dist, test, container, helm]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
